
# DATABASE CONFIGURATION

# Connection URL for PostgreSQL.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}

# Disable Spring Security for development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.security.enabled=false

spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE SETTINGS

# 'update' automatically creates/updates database tables based on Java Entities.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console for debugging purposes.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for PostgreSQL optimization.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# SERVER & SECURITY CONFIGURATION

# Default server port for the application backend.
server.port=8080

# Temporary credentials for development phase.
spring.security.user.name=user
spring.security.user.password=password

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
server.port=${PORT:8080}